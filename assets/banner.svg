<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="40%" stop-color="#0e172a"/>
      <stop offset="80%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Text Vibrant Gradient -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.35"/>
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Decorative Grid Nodes -->
  <g opacity="0.18">
    <circle cx="150" cy="80" r="2" fill="#38bdf8"/>
    <circle cx="350" cy="60" r="2" fill="#818cf8"/>
    <circle cx="600" cy="90" r="2.5" fill="#c084fc"/>
    <circle cx="850" cy="50" r="2" fill="#38bdf8"/>
    <circle cx="1050" cy="80" r="2" fill="#818cf8"/>
    <line x1="150" y1="80" x2="350" y2="60" stroke="#818cf8" stroke-width="0.5"/>
    <line x1="350" y1="60" x2="600" y2="90" stroke="#818cf8" stroke-width="0.5"/>
    <line x1="600" y1="90" x2="850" y2="50" stroke="#818cf8" stroke-width="0.5"/>
    <line x1="850" y1="50" x2="1050" y2="80" stroke="#818cf8" stroke-width="0.5"/>
  </g>

  <!-- Flowing Aesthetic Waves -->
  <path d="M0,220 C300,160 500,280 800,210 C1000,160 1100,240 1200,200 L1200,320 L0,320 Z" fill="url(#wave2-grad)"/>
  <path d="M0,240 C250,180 550,290 850,220 C1050,180 1150,250 1200,230 L1200,320 L0,320 Z" fill="url(#wave1-grad)"/>

  <!-- Decorative Modern Badge Tag -->
  <g transform="translate(480, 48)">
    <rect width="240" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="4" fill="#38bdf8"/>
    <text x="30" y="18" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1.5">FULL-SPECTRUM ENGINEER</text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="145" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" fill="url(#name-grad)" letter-spacing="1.5" filter="url(#glow)">
    Aya MOUTAOUAKIL
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="1.2">
    Software Engineer   •   Systems Architect   •   Data &amp; Decision Intelligence
  </text>
</svg>
